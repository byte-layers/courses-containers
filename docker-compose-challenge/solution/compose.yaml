name: layers-l7-notes
services:
  front:
    image: nginx:1.30-alpine
    ports:
      - "28372:80"
    volumes:
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - edge
  api:
    build: ./api
    environment:
      REDIS_HOST: cache
      GREETING: ${GREETING:-Bonjour}
    depends_on:
      - cache
    networks:
      - edge
      - back
  cache:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache-data:/data
    networks:
      - back
volumes:
  cache-data:
networks:
  edge:
  back:
